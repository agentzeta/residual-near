name: Live mainnet scan
on:
  workflow_dispatch:
    inputs:
      sample:
        description: Number of transaction signers to draw
        default: '200'
        type: string
      window:
        description: Number of blocks to scan
        default: '60'
        type: string
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan NEAR mainnet
        env:
          FASTNEAR_API_KEY: ${{ secrets.FASTNEAR_API_KEY }}
          SAMPLE: ${{ inputs.sample }}
          WINDOW: ${{ inputs.window }}
        run: python -m residual --sample-signers "$SAMPLE" --window-blocks "$WINDOW" --output live-output
      - name: Summary
        if: always()
        run: python scripts/summary.py live-output/report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residual-mainnet-report
          path: live-output/
