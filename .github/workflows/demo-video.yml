name: Record demo video
on: workflow_dispatch
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mainnet snapshot (nonblocking)
        continue-on-error: true
        env:
          FASTNEAR_API_KEY: ${{ secrets.FASTNEAR_API_KEY }}
        run: python -m residual --sample-signers 200 --window-blocks 60 --output site/data/latest
      - name: Install browser
        run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Record a successful live account and sample
        run: |
          python -m http.server 8000 --directory site > /dev/null 2>&1 &
          sleep 2
          node demo/record.cjs http://127.0.0.1:8000/
      - name: Convert recording to MP4
        run: ffmpeg -y -loglevel error -i demo-video/raw.webm -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -movflags +faststart demo-video/residual-demo.mp4 && rm demo-video/raw.webm
      - name: Scan summary
        if: always()
        run: python scripts/summary.py site/data/latest/report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residual-demo-video
          path: demo-video/
